<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Catalyst Documentation Shortcuts</title>
    <link rel="stylesheet" href="popup.css" />
    <style>
      html,
      body,
      #app {
        height: auto;
      }

      }
